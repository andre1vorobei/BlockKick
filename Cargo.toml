[package]
name = "BlockKick"
version = "0.1.0"
edition = "2024"

[dependencies]
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
hex = "0.4.3"
rand = "0.8.5"
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.149"
sha2 = "0.10.9"
sha256 = "1.6.0"
tiny_http = "0.12"
url = "2.5.8"

# Асинхронный runtime для P2P
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Сериализация для сетевого протокола
bincode = "1.3"  # или оставь serde_json для простоты

# Утилиты
bytes = "1.5"
futures = "0.3"

log = "0.4"
fern = "0.7"
chrono = "0.4"
